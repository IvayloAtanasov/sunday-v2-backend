AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Description: Sunday V2 backend services

Parameters:
  Env:
    Type: String
    Default: Staging

Resources:

  SundaySecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: SundaySecretsStore
      Description: 'Sunday Secrets Store'
      SecretString: '{}'

  # Imported from the sun (v1) shareholders stack. Retain is required by
  # CloudFormation resource import and keeps the data safe if this stack is ever deleted.
  SpotPricesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: spot-prices
      KeySchema:
        - AttributeName: country
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: country
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      BillingMode: PAY_PER_REQUEST

  SundayLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SundayLambdaExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref SundaySecrets
        - PolicyName: DynamoDBReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt SpotPricesTable.Arn

  SundayIOTDataCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: built/iot-data-collector/src/index.handler
      CodeUri: iot-data-collector
      # Pinned to 22.x: @sparticuz/chromium 133 picks its bundled shared libraries by
      # matching "20.x"/"22.x" in AWS_EXECUTION_ENV. On nodejs24.x it falls through to
      # the AL2 bundle, which omits libnspr4.so, and chromium fails to launch.
      # Upgrading chromium to >=149 is the prerequisite for bumping this to 24.x.
      Runtime: nodejs22.x
      FunctionName: sunday-v2-iot-data-collector
      Tags:
        Project: sunday
        Version: 2
        Env: !Ref Env
      Environment:
        Variables:
          Env: !Ref Env
      Description: Collects IOT data from PV devices
      Timeout: 900
      Events:
        StartScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 8-10 * * ? *)
            Enabled: true
      MemorySize: 1024
      Role: !GetAtt SundayLambdaExecutionRole.Arn
    Metadata:
      BuildProperties:
        UseNpmCi: True

  SundayHttpApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: sunday-v2-api-gateway
      StageName: staging
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
        AllowOrigin: "'*'"

  SundayApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: built/api/src/index.handler
      CodeUri: api
      Runtime: nodejs24.x
      FunctionName: sunday-v2-api
      Tags:
        Project: sunday
        Version: 2
        Env: !Ref Env
      Environment:
        Variables:
          Env: !Ref Env
      Description: Sunday public API
      Events:
        GetEnergyPrices:
          Type: Api
          Properties:
            Path: /energy-prices
            Method: GET
            RestApiId: !Ref SundayHttpApi
        GetPvMetrics:
          Type: Api
          Properties:
            Path: /pv-metrics
            Method: GET
            RestApiId: !Ref SundayHttpApi
        GetInstallations:
          Type: Api
          Properties:
            Path: /installations
            Method: GET
            RestApiId: !Ref SundayHttpApi
      MemorySize: 512
      Role: !GetAtt SundayLambdaExecutionRole.Arn
    Metadata:
      BuildProperties:
        UseNpmCi: True

  SundayChainlinkYieldSyncer:
    Type: AWS::Serverless::Function
    Properties:
      Handler: built/chainlink-yield-syncer/src/index.handler
      CodeUri: chainlink-yield-syncer
      Runtime: nodejs24.x
      FunctionName: sunday-v2-chainlink-yield-syncer
      Tags:
        Project: sunday
        Version: 2
        Env: !Ref Env
      Environment:
        Variables:
          Env: !Ref Env
      Description: Triggers Chainlink function to transparently compute installation daily profit based on yield and market prices
      Timeout: 900
      Events:
        StartScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 11 * * ? *)
            Enabled: true
      MemorySize: 512
      Role: !GetAtt SundayLambdaExecutionRole.Arn
    Metadata:
      BuildProperties:
        UseNpmCi: True

  # Not on SundayLambdaExecutionRole: that role is read-only on spot-prices and this is
  # the only function that writes to it.
  SundayPriceCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: built/price-collector/src/index.handler
      CodeUri: price-collector
      Runtime: nodejs24.x
      FunctionName: sunday-v2-price-collector
      Tags:
        Project: sunday
        Version: 2
        Env: !Ref Env
      Environment:
        Variables:
          Env: !Ref Env
      Description: Collects daily electricity prices, backfilling any missed days
      Timeout: 300
      Events:
        StartScheduledEvent:
          Type: Schedule
          Properties:
            Schedule: cron(0 8-10 * * ? *)
            Enabled: true
      MemorySize: 256
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref SpotPricesTable
    Metadata:
      BuildProperties:
        UseNpmCi: True
